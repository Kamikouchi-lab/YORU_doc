# Setup
title:               YORU
tagline:             'Your Optimal Recognition Utility'
description:         '“YORU” is open-source software for animal behavior detection using object detection. YORU classifies animal behaviors as "behavior objects."'
url:                 "https://kamikouchi-lab.github.io"
baseurl:             "/YORU_doc"
permalink:           pretty
markdown:            kramdown

# The Lanyon layouts, includes and styles are all in this repository.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# About/contact
author:
  name:              Hayato M. Yamanouchi
  url:               https://github.com/HMYamano
  email:             haya.m.yamano.neuro@gmail.com


# Custom vars
version:             v 1.1.2
beta_version:        v2.0.0-beta.4
google_analytics_id: G-GT3X41B0YR


github:
  repo: https://github.com/Kamikouchi-lab/YORU
  user: HMYamano
  project: repository

Store:
  URL: https://www.zazzle.co.jp/store/yorustore?rf=238712148117349309

sponsor:
  URL: https://github.com/sponsors/HMYamano

exclude:
  - scripts
  - DASHBOARD_SETUP.md
  - README.md

collections:
  tutorial:
    output: true
    permalink: /tutorial/:name/
  devnotes:
    output: true
    permalink: /devnotes/:name/ 
  guides:
    output: true
    permalink: /guides/:name/
  beta_guides:
    output: true
    permalink: /beta-guides/:name/
  plugins:
    output: true
    permalink: /plugins/:name/